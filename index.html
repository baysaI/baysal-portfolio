<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title data-i18n="meta.title"></title>
    <meta name="description" content="" data-i18n-attr="content:meta.description" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="color-scheme" content="dark" />
    <meta name="author" content="{{site.name}}" />
    <link rel="canonical" href="{{site.url}}" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="manifest" href="./site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{site.name}}" />
    <meta property="og:url" content="{{site.url}}" />
    <meta property="og:title" content="" data-i18n-attr="content:meta.title" />
    <meta property="og:description" content="" data-i18n-attr="content:meta.description" />
    <meta property="og:image" content="{{site.url}}og.jpg?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="" data-i18n-attr="content:meta.imageAlt" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="" data-i18n-attr="content:meta.title" />
    <meta name="twitter:description" content="" data-i18n-attr="content:meta.description" />
    <meta name="twitter:image" content="{{site.url}}og.jpg?v=2" />
    <meta name="twitter:image:alt" content="" data-i18n-attr="content:meta.imageAlt" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "{{site.name}}",
        "jobTitle": "{{site.role}}",
        "url": "{{site.url}}",
        "image": "{{site.url}}mehmet-baysal-800.webp",
        "email": "mailto:{{site.email}}",
        "address": { "@type": "PostalAddress", "addressLocality": "{{site.location}}" },
        "sameAs": ["{{site.github}}", "{{site.linkedin}}"],
        "alumniOf": "Burdur Mehmet Akif Ersoy Üniversitesi"
      }
    </script>
    <script>
      document.documentElement.classList.replace('no-js', 'js');
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="skip"></a>

    <div class="loader" data-loader aria-hidden="true">
      <div class="loader__top">
        <span class="label" data-i18n="loader.label"></span>
        <span class="label">&copy;{{year}}</span>
      </div>
      <p class="loader__brand">{{site.name}}</p>
      <div class="loader__bottom">
        <div class="loader__bar"><span data-loader-bar></span></div>
        <p class="loader__count"><span data-loader-count>0</span></p>
      </div>
    </div>

    <canvas class="webgl" data-webgl aria-hidden="true"></canvas>

    <div class="cursor" data-cursor aria-hidden="true">
      <span class="cursor__ring"><span class="cursor__label" data-cursor-label></span></span>
      <span class="cursor__dot"></span>
    </div>

    <div class="progress" aria-hidden="true"><span data-progress></span></div>

    <div class="curtain" data-curtain aria-hidden="true">
      <div class="curtain__veil"></div>
      <div class="curtain__panel">
        <div class="curtain__top label">
          <span data-curtain-index>(00)</span>
          <span>{{site.name}}</span>
        </div>
        <p class="curtain__title"><span data-curtain-title></span></p>
        <div class="curtain__bar"><span data-curtain-bar></span></div>
      </div>
    </div>

    <header class="header" data-header>
      <a class="header__logo" href="#top" aria-label="{{site.name}}">{{site.name}}</a>
      <nav class="header__nav" aria-label="Primary">
        <ul>
          <li><a href="#work" data-i18n="nav.work"></a></li>
          <li><a href="#about" data-i18n="nav.about"></a></li>
          <li><a href="#services" data-i18n="nav.services"></a></li>
          <li><a href="#experience" data-i18n="nav.experience"></a></li>
          <li><a href="#contact" data-i18n="nav.contact"></a></li>
        </ul>
      </nav>
      <div class="header__meta">
        <p class="status">
          <span class="status__dot"></span><span data-i18n="header.status"></span>
        </p>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="tr" aria-pressed="false">TR</button>
        </div>
        <button
          class="header__menu"
          type="button"
          data-menu-toggle
          aria-expanded="false"
          aria-controls="menu"
        >
          <span data-i18n="nav.menu"></span>
        </button>
      </div>
    </header>

    <div class="menu" id="menu" data-menu hidden>
      <nav aria-label="Mobile">
        <ul class="menu__list">
          <li><a href="#work" data-i18n="nav.work"></a></li>
          <li><a href="#about" data-i18n="nav.about"></a></li>
          <li><a href="#services" data-i18n="nav.services"></a></li>
          <li><a href="#experience" data-i18n="nav.experience"></a></li>
          <li><a href="#contact" data-i18n="nav.contact"></a></li>
        </ul>
      </nav>
      <a class="menu__mail" href="mailto:{{site.email}}">{{site.email}}</a>
    </div>

    <main id="main">
      <section class="hero" id="top" data-section="hero">
        <div class="hero__top">
          <p class="label" data-i18n="hero.eyebrow"></p>
          <p class="label hero__location" data-i18n="hero.location"></p>
        </div>
        <h1 class="hero__title">
          <span class="hero__line" data-split data-i18n="hero.title.a"></span>
          <span class="hero__line hero__line--shift" data-split data-i18n="hero.title.b"></span>
        </h1>
        <div class="hero__bottom">
          <p class="hero__intro" data-i18n="hero.intro"></p>
          <a class="hero__scroll" href="#about">
            <span class="label" data-i18n="hero.scroll"></span>
            <span class="hero__scroll-line" aria-hidden="true"></span>
          </a>
        </div>
      </section>

      <section class="about" id="about" data-section="about">
        <div class="container about__grid">
          <p class="label about__label" data-i18n="about.label"></p>
          <p class="about__text" data-words data-i18n="about.text"></p>
          <figure class="about__portrait" data-portrait>
            <div class="about__photo">
              <img
                src="mehmet-baysal-480.webp"
                srcset="mehmet-baysal-480.webp 480w, mehmet-baysal-800.webp 800w"
                sizes="(max-width: 900px) 14rem, 18vw"
                width="800"
                height="993"
                alt=""
                data-i18n-attr="alt:about.photo"
                loading="lazy"
                decoding="async"
              />
            </div>
            <figcaption class="label">{{site.name}} — {{site.location}}</figcaption>
          </figure>
          <div class="about__side">
            <p data-i18n="about.side"></p>
            <p class="about__map label" data-i18n="about.map"></p>
            <a class="btn" href="#contact" data-magnetic>
              <span class="btn__fill" aria-hidden="true"></span>
              <span class="btn__text" data-i18n="about.cta"></span>
            </a>
          </div>
        </div>
      </section>

      <section class="work" id="work" data-section="work">
        <div class="work__pin" data-work-pin>
          <div class="work__head container">
            <p class="label" data-i18n="work.label"></p>
            <h2 class="sr-only" data-i18n="work.title"></h2>
            <p class="label work__counter">
              <span class="work__index" data-work-index>01</span>
              <span>/ {{projects.count}}</span>
            </p>
          </div>
          <ol class="work__list container" data-work-list>
            <!-- @projects -->
          </ol>
          <div class="work__progress container" aria-hidden="true">
            <!-- @projectProgress -->
          </div>
        </div>
      </section>

      <section class="marquee" aria-hidden="true" data-marquee>
        <div class="marquee__track" data-marquee-track>
          <!-- @marquee -->
        </div>
      </section>

      <section class="services" id="services" data-section="services" data-opaque>
        <div class="container">
          <div class="services__head">
            <p class="label" data-i18n="services.label"></p>
            <h2 class="services__title" data-split data-i18n="services.title"></h2>
          </div>
          <ul class="services__list">
            <!-- @services -->
          </ul>
        </div>
      </section>

      <section class="experience" id="experience" data-section="experience" data-opaque>
        <div class="container">
          <div class="experience__head">
            <p class="label" data-i18n="experience.label"></p>
            <h2 class="experience__title" data-split data-i18n="experience.title"></h2>
          </div>
          <div class="experience__body">
            <div class="experience__main">
              <!-- @experience -->
            </div>
            <aside class="experience__side">
              <!-- @education -->
            </aside>
          </div>
        </div>
      </section>

      <section class="process" id="process" data-section="process">
        <div class="process__pin" data-process-pin>
          <div class="process__head container">
            <p class="label" data-i18n="process.label"></p>
            <h2 class="process__title" data-split data-i18n="process.title"></h2>
          </div>
          <div class="process__graph" data-process-graph aria-hidden="true"></div>
          <div class="process__track" data-process-track>
            <!-- @process -->
          </div>
        </div>
      </section>

      <section class="stats" data-section="stats">
        <ul class="stats__list container">
          <!-- @stats -->
        </ul>
      </section>

      <section class="contact" id="contact" data-section="contact">
        <div class="container contact__inner">
          <p class="label" data-i18n="contact.label"></p>
          <h2 class="contact__title">
            <span class="contact__line" data-split data-i18n="contact.title.a"></span>
            <span class="contact__line" data-split data-i18n="contact.title.b"></span>
          </h2>
          <p class="contact__text" data-i18n="contact.text"></p>
          <div class="contact__actions">
            <a class="contact__cta" href="mailto:{{site.email}}" data-magnetic data-cursor="mail">
              <span class="contact__cta-fill" aria-hidden="true"></span>
              <span class="contact__cta-label" data-i18n="contact.cta"></span>
              <span class="contact__cta-mail">{{site.email}}</span>
            </a>
            <a class="btn contact__cv" href="Mehmet_Baysal_CV.pdf" download data-magnetic>
              <span class="btn__fill" aria-hidden="true"></span>
              <span class="btn__text" data-i18n="contact.cv"></span>
              <span class="contact__cv-meta" aria-hidden="true">PDF ↓</span>
            </a>
          </div>
          <div class="contact__social">
            <p class="label" data-i18n="contact.social"></p>
            <ul>
              <!-- @socials -->
            </ul>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <p>&copy; {{year}} {{site.name}}. <span data-i18n="footer.rights"></span></p>
        <p>
          <span data-i18n="footer.time"></span>
          <time class="footer__clock" data-clock>--:--</time>
          <span class="footer__tz">{{site.location}}</span>
        </p>
        <p data-i18n="footer.credit"></p>
        <a class="footer__top" href="#top" data-i18n="footer.top"></a>
      </div>
    </footer>

    <p class="fallback-note" data-fallback-note data-i18n="fallback" hidden></p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
